<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ — Bishkek Gigs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-blue-600 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="text-xl font-bold">🛵 Bishkek Gigs — Админ</a>
      <div id="nav-auth" class="flex items-center gap-4"></div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <div id="admin-gate" class="hidden">
      <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
        Доступ только для администраторов. <a href="index.html" class="underline">На главную</a>
      </div>
    </div>

    <div id="admin-content" class="hidden">
      <!-- Create Task Form -->
      <div class="bg-white rounded-xl shadow p-6 mb-8">
        <h2 class="text-xl font-bold mb-4">Создать новое задание</h2>
        <form id="create-task-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2">
            <label class="block text-sm font-medium mb-1">Название *</label>
            <input type="text" id="task-title" required class="w-full border rounded-lg px-3 py-2">
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium mb-1">Описание</label>
            <textarea id="task-desc" rows="3" class="w-full border rounded-lg px-3 py-2"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Адрес забора *</label>
            <input type="text" id="pickup-address" required placeholder="ул. Киевская 123" class="w-full border rounded-lg px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Адрес доставки *</label>
            <input type="text" id="delivery-address" required placeholder="пр. Чуй 456" class="w-full border rounded-lg px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Широта забора (lat)</label>
            <input type="number" step="any" id="pickup-lat" placeholder="42.87" class="w-full border rounded-lg px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Долгота забора (lng)</label>
            <input type="number" step="any" id="pickup-lng" placeholder="74.59" class="w-full border rounded-lg px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Широта доставки</label>
            <input type="number" step="any" id="delivery-lat" class="w-full border rounded-lg px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Долгота доставки</label>
            <input type="number" step="any" id="delivery-lng" class="w-full border rounded-lg px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Оплата (сом) *</label>
            <input type="number" id="task-reward" required min="0" step="10" value="200" class="w-full border rounded-lg px-3 py-2">
          </div>
          <div class="md:col-span-2">
            <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 font-medium">
              Опубликовать задание
            </button>
          </div>
        </form>
        <p id="create-status" class="mt-3 text-sm"></p>
      </div>

      <!-- All Tasks Management -->
      <div class="bg-white rounded-xl shadow p-6">
        <h2 class="text-xl font-bold mb-4">Все задания</h2>
        <div id="admin-tasks-list" class="space-y-4">
          <!-- Loaded by JS -->
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
