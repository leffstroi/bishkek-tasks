<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Создать задание — Bishkek Gigs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-blue-600 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="text-xl font-bold">🛵 Bishkek Gigs</a>
      <div id="nav-auth" class="flex items-center gap-4"></div>
    </div>
  </nav>

  <main class="max-w-xl mx-auto px-4 py-8">
    <div id="login-gate" class="hidden bg-white rounded-xl shadow p-6">
      <p class="mb-4">Чтобы создать задание, войдите в аккаунт.</p>
      <a href="login.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg inline-block">Войти</a>
    </div>

    <div id="create-box" class="hidden bg-white rounded-xl shadow p-6">
      <h1 class="text-2xl font-bold mb-2">Новое задание</h1>
      <p class="text-gray-600 text-sm mb-6">Опиши работу. Кто-то возьмёт её, сделает и ты оплатишь напрямую.</p>

      <form id="create-task-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Название *</label>
          <input type="text" id="task-title" required placeholder="Отвезти документы" class="w-full border rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Описание</label>
          <textarea id="task-desc" rows="3" placeholder="Что нужно сделать" class="w-full border rounded-lg px-3 py-2"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Откуда забрать *</label>
          <input type="text" id="pickup-address" required placeholder="ул. Киевская 123" class="w-full border rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Куда отнести *</label>
          <input type="text" id="delivery-address" required placeholder="пр. Чуй 456" class="w-full border rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Оплата (сом) *</label>
          <input type="number" id="task-reward" required min="50" step="10" value="200" class="w-full border rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Твой Telegram (без @) *</label>
          <input type="text" id="telegram" required placeholder="username" class="w-full border rounded-lg px-3 py-2">
          <p class="text-xs text-gray-500 mt-1">Исполнитель напишет тебе сюда после работы</p>
        </div>
        <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-medium hover:bg-green-700">
          Опубликовать
        </button>
      </form>
      <p id="create-status" class="mt-3 text-sm"></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
