<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Bishkek Gigs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <nav class="bg-blue-600 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3">
      <a href="index.html" class="text-xl font-bold">🛵 Bishkek Gigs</a>
    </div>
  </nav>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
      <h1 class="text-2xl font-bold text-center mb-6">Вход</h1>
      
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="email" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
          <input type="password" id="password" required minlength="6" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">
          Войти
        </button>
      </form>

      <p id="login-error" class="mt-4 text-red-600 text-sm text-center hidden"></p>
      <p id="login-success" class="mt-4 text-green-600 text-sm text-center hidden"></p>

      <p class="mt-6 text-center text-gray-600 text-sm">
        Нет аккаунта? <a href="signup.html" class="text-blue-600 hover:underline">Зарегистрироваться</a>
      </p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('login-error');
      const okEl = document.getElementById('login-success');
      errEl.classList.add('hidden');
      okEl.classList.add('hidden');

      try {
        await Auth.signIn(email, password);
        okEl.textContent = 'Успешный вход! Перенаправление...';
        okEl.classList.remove('hidden');
        setTimeout(() => window.location.href = 'index.html', 1000);
      } catch (err) {
        errEl.textContent = err.message || 'Ошибка входа';
        errEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
